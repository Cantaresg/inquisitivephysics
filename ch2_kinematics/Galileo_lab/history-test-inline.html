<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History Card — Test Harness</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root {
  --bg:#0a0c12; --surface:#111520; --surface2:#161b28;
  --border:#252d42; --border2:#2e3850;
  --accent:#4df0b0; --accent-dim:rgba(77,240,176,0.12);
  --gold:#ffd166; --purple:#c77dff; --red:#ff6b6b;
  --text:#eef2ff; --text-mid:#a8b4d0; --text-dim:#6b7a99;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{display:flex;align-items:center;padding:0 20px;height:48px;background:var(--surface);border-bottom:1px solid var(--border);gap:12px;flex-shrink:0;position:sticky;top:0;z-index:10;}
.logo{font-size:.95rem;font-weight:700;color:var(--accent);}
.logo em{color:var(--text);font-style:normal;}
.htag{font-size:.7rem;font-family:'DM Mono',monospace;color:var(--text-dim);border:1px solid var(--border2);border-radius:12px;padding:2px 10px;}
.app{display:flex;flex:1;min-height:0;overflow:hidden;}
.hist-col{flex:1;overflow-y:auto;background:var(--bg);}
.side{width:268px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;}
.ps{padding:14px 16px 12px;border-bottom:1px solid var(--border);}
.ps:last-child{border-bottom:none;}
.ps-title{font-size:.6rem;font-family:'DM Mono',monospace;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;font-weight:500;}
.btn{font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:600;padding:7px 14px;border-radius:7px;border:1.5px solid var(--border2);background:var(--surface2);color:var(--text);cursor:pointer;transition:all .15s;width:100%;margin-bottom:6px;text-align:left;}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
.btn.go{background:var(--accent);color:#050a0a;border-color:var(--accent);font-weight:700;}
.btn.go:hover{background:#38d49a;}
.btn.danger:hover{border-color:var(--red);color:var(--red);background:rgba(255,107,107,.1);}
.alias-row{display:flex;gap:7px;margin-bottom:8px;}
.alias-input{flex:1;background:var(--bg);border:1.5px solid var(--border2);border-radius:7px;padding:6px 9px;font-family:'DM Mono',monospace;font-size:.74rem;color:var(--text);outline:none;transition:border-color .15s;}
.alias-input:focus{border-color:var(--accent);}
.alias-input::placeholder{color:var(--text-dim);}
.chip{display:block;font-family:'DM Mono',monospace;font-size:.62rem;padding:3px 9px;border-radius:10px;border:1px solid var(--border2);color:var(--text-dim);margin-bottom:5px;transition:all .3s;}
.chip.active{border-color:var(--gold);color:var(--gold);}
.chip.done{border-color:var(--accent);color:var(--accent);}
.log{font-family:'DM Mono',monospace;font-size:.66rem;color:var(--text-dim);line-height:1.85;max-height:260px;overflow-y:auto;}
.log .ok{color:var(--accent);}
.log .info{color:var(--gold);}
.resp-lbl{font-size:.58rem;font-family:'DM Mono',monospace;color:var(--text-dim);letter-spacing:.07em;margin-bottom:3px;margin-top:8px;}
.resp-lbl:first-child{margin-top:0;}
.resp-block{background:var(--bg);border:1px solid var(--border2);border-radius:6px;padding:6px 9px;font-family:'DM Mono',monospace;font-size:.66rem;color:var(--text-mid);line-height:1.6;white-space:pre-wrap;word-break:break-word;min-height:28px;}
</style>
</head>
<body>
<header>
  <div class="logo">Physics<em>Sims</em></div>
  <div class="htag">draw-history.js · TEST HARNESS</div>
</header>
<div class="app">
  <div class="hist-col" id="histContainer"></div>
  <div class="side">

    <div class="ps">
      <div class="ps-title">Student Alias</div>
      <div class="alias-row">
        <input class="alias-input" id="aliasInput" placeholder="e.g. alice_01" value="student_a"/>
      </div>
      <button class="btn go" onclick="doStart()">▶ Start History Card</button>
      <button class="btn danger" onclick="doReset()">↺ Reset</button>
    </div>

    <div class="ps">
      <div class="ps-title">Seed Preview</div>
      <div class="chip" id="seedChip" style="font-size:.58rem;word-break:break-all;">—</div>
      <div style="font-size:.62rem;color:var(--text-dim);margin-top:6px;line-height:1.6;">Same alias → same draw every time. Change alias to see different options.</div>
    </div>

    <div class="ps">
      <div class="ps-title">Section Status</div>
      <div class="chip" id="chip-0">Section 1 — The Myth</div>
      <div class="chip" id="chip-1">Section 2 — The Reality</div>
      <div class="chip" id="chip-2">Section 3 — The Insight</div>
      <div class="chip" id="chip-done">Complete</div>
    </div>

    <div class="ps">
      <div class="ps-title">Captured Responses</div>
      <div id="respOut">
        <div class="resp-lbl">S0</div><div class="resp-block" id="resp-0">—</div>
        <div class="resp-lbl">S1</div><div class="resp-block" id="resp-1">—</div>
        <div class="resp-lbl">S2</div><div class="resp-block" id="resp-2">—</div>
      </div>
    </div>

    <div class="ps">
      <div class="ps-title">Console</div>
      <div class="log" id="log"></div>
    </div>

  </div>
</div>

<!-- DataLogger stub -->
<script>
const DataLogger = {
  _alias: 'student_a',
  getAlias(){ return this._alias; },
  log(key, data){ console.log('[DataLogger]', key, data); },
};
</script>

<!-- history-data.js inlined -->
<script>
const HistoryData = {
  sections:[
    {
      tag:'THE MYTH',tagColor:'var(--gold,#ffd166)',heading:'The Story Everyone Knows',
      prose:`<p>Around 1590, so the story goes, Galileo Galilei climbed to the top of the Leaning Tower of Pisa, held out a cannonball and a musket ball, and dropped them simultaneously. The heavy ball and the light ball — according to Aristotle — should land at very different times. The crowd below watched. Both hit the ground together. Aristotle was wrong. The end.</p><p>It is a great story. Dramatic setting, clear result, heroic scientist proving the establishment wrong in front of witnesses.</p>`,
      figure:'tower',hasCanvas:true,prompt:'Select all the statements you agree with.',
      pool:{
        misconceptions:[
          {id:'S0_M0',text:'Heavier objects always fall faster — mass alone determines fall speed.',explanation:'Mass alone does not determine fall speed in air. The flat paper and the crumpled ball have the same mass but fall at different speeds. What changed was the shape — and therefore the air resistance.'},
          {id:'S0_M1',text:'Shape does not affect how fast something falls — only mass counts.',explanation:'The mini drop showed otherwise. Flat paper and crumpled paper have identical mass. The crumpled ball fell faster because its smaller surface area produced less air resistance. Shape matters.'},
          {id:'S0_M2',text:'Air resistance only affects light objects — not things like crumpled paper.',explanation:'Air resistance acts on all objects. Even the crumpled paper experienced less drag than the flat sheet, and fell noticeably faster as a result.'},
          {id:'S0_M3',text:'The Tower of Pisa story must be true — the conclusion has been proven correct.',explanation:'A conclusion being correct does not mean the story that supports it is accurate. In air, a cannonball and a musket ball do not land at exactly the same time. The story as told is physically misleading.'},
          {id:'S0_M4',text:'As long as the result is correct, it does not matter how the experiment was done.',explanation:'Method matters enormously. An experiment done poorly can produce the right answer by accident. Galileo\'s strength was not his conclusion but his method: controlled, repeatable, measurable.'},
          {id:'S0_M5',text:'An iron ball and a feather dropped from a tall building would land at the same time.',explanation:'Only in a vacuum. In air, the feather experiences far more drag relative to its weight. They land together only when air is removed — as astronaut David Scott demonstrated on the Moon in 1971.'},
        ],
        correct:[
          {id:'S0_C0',text:'In air, shape affects fall speed.',explanation:'Correct. The mini drop demonstrated this directly — flat paper and crumpled paper have the same mass, but the flat sheet fell much more slowly because its large surface area produced greater air resistance.'},
          {id:'S0_C1',text:'The Tower of Pisa story may not be accurate — a single drop in air cannot cleanly prove that all objects fall at the same rate.',explanation:'Correct. The story first appeared decades after Galileo\'s death. More importantly, dropping objects in air introduces air resistance — making the result messy and hard to interpret cleanly.'},
          {id:'S0_C2',text:'Air resistance depends on shape and surface area, not just how heavy something is.',explanation:'Correct. The drag force F = ½ρCdAv² involves area A and drag coefficient Cd — neither involves mass. Two objects with the same mass but different shapes experience very different drag forces.'},
          {id:'S0_C3',text:'In air, a heavier object of the same shape falls faster than a lighter one.',explanation:'Correct. When shape is held constant, a heavier object has a higher terminal velocity — the speed at which drag equals weight. A lead ball and a hollow plastic ball of the same size fall at different speeds in air.'},
        ],
      },
      draw:{misconceptions:3,correct:2},
    },
    {
      tag:'THE REALITY',tagColor:'var(--accent,#4df0b0)',heading:'What Galileo Actually Did',
      prose:`<p>There is no reliable historical record of the Tower drop ever happening. The story first appeared decades after Galileo's death, written by his student Vincenzo Viviani — who was known to embellish.</p><p>What Galileo <em>did</em> do, documented in his own notebooks, was far more careful — and far more powerful. He built a long, smooth ramp. He varied the length. He timed the rolls using a water clock. He recorded the numbers. He noticed that the time depended on the length of the ramp, not on the mass of the ball.</p><p>By controlling one variable at a time, he could separate the effect of gravity from the effect of air resistance — something a single dramatic drop from a tower could never cleanly do.</p>`,
      figure:'ramp',hasCanvas:false,prompt:'Select all the statements you agree with.',
      pool:{
        misconceptions:[
          {id:'S1_M0',text:'The heavier ball should reach the bottom of the ramp first.',explanation:'On a frictionless ramp, both balls experience the same acceleration — g sinθ — regardless of mass. Mass cancels out. The experiment confirmed this: both balls landed at the same time.'},
          {id:'S1_M1',text:'Increasing the mass of the ball would decrease the time it takes to reach the bottom of the ramp.',explanation:'Mass has no effect on ramp time. The acceleration g sinθ contains no mass term. Doubling the mass doubles both the driving force and the inertia — they cancel exactly.'},
          {id:'S1_M2',text:'One well-designed experiment is enough to establish a scientific result.',explanation:'A single experiment can be affected by measurement error, random variation, or uncontrolled variables. Scientific results require repeated trials. Galileo rolled balls down his ramp many times, not once.'},
          {id:'S1_M3',text:'The ramp result only applies to ramps — it tells us nothing about free fall.',explanation:'Galileo used the ramp precisely because it slows motion enough to measure. The physics is the same — gravity acting on a mass. By varying the angle, he could extrapolate towards free fall (90°).'},
          {id:'S1_M4',text:'Recording exact times is unnecessary — you can tell which ball wins just by watching.',explanation:'Visual observation is unreliable for small differences. Both balls land at almost the same time — the eye cannot distinguish a 10ms difference. Precise timing revealed that mass makes no difference at all.'},
          {id:'S1_M5',text:'An approximate time is good enough — small differences in measurement do not affect the conclusion.',explanation:'Measurement precision directly affects conclusions. The relationship t² ∝ L only emerges clearly from accurate timing. Imprecise measurements introduce scatter that can obscure the pattern entirely.'},
          {id:'S1_M6',text:'Both balls reach the bottom at the same time on a smooth ramp, but the heavier ball reaches the bottom faster if the ramp is rough.',explanation:'Even on a rough ramp, both balls still reach the bottom at the same time. Friction force μmg cosθ and driving force mg sinθ both contain m — it cancels. The result is independent of mass whether the surface is smooth or rough.'},
        ],
        correct:[
          {id:'S1_C0',text:'Both balls reached the bottom at the same time — mass did not affect the result.',explanation:'Correct. On a frictionless ramp, acceleration = g sinθ for all masses. The experiment confirmed this directly — heavy and light balls landed simultaneously across all ramp lengths tested.'},
          {id:'S1_C1',text:'Galileo controlled one variable at a time, exactly as we varied only L while keeping the angle fixed.',explanation:'Correct. By fixing the angle and varying only the length, Galileo (and you) could isolate the effect of length on time — and discover the t² ∝ L relationship cleanly.'},
          {id:'S1_C2',text:'Repeated careful measurement is more reliable than visual observation alone.',explanation:'Correct. Repeated measurement allows identification of random error, calculation of averages, and assessment of consistency. Visual observation is subject to reaction time and expectation bias.'},
          {id:'S1_C3',text:'The ramp slows the motion enough to measure accurately — the same principle applies to free fall.',explanation:'Correct. At 30°, acceleration = g sin30° ≈ 4.9 m/s² — about half of free fall. This made timing tractable. The physics is identical; only the rate differs.'},
        ],
      },
      draw:{misconceptions:3,correct:2},
    },
    {
      tag:'THE INSIGHT',tagColor:'var(--purple,#c77dff)',heading:'What This Means',
      prose:`<p>The Tower story is satisfying because it is simple: one drop, one answer. But simplicity can mislead. In air, a feather and a ball <em>don't</em> land together — you saw that yourself. A single dramatic demonstration would have proved nothing reliable.</p><p>Galileo's genius was not the spectacle. It was the method: isolate one variable, repeat the measurement, look for a pattern in the numbers. That is still how physics — and all of science — works today.</p><p>When you placed the paper on the book and they fell together, you were not just watching a trick. You were isolating air resistance the same way Galileo isolated mass on his ramp. The method is 400 years old. You just used it.</p>`,
      figure:'method',hasCanvas:false,prompt:'Select all the statements you agree with.',
      pool:{
        misconceptions:[
          {id:'S2_M0',text:'A dramatic public demonstration is more convincing than repeated careful measurements.',explanation:'A dramatic demonstration may be persuasive, but persuasion is not the same as evidence. Repeated careful measurements with controlled variables produce results that can be verified, challenged, and built upon.'},
          {id:'S2_M1',text:'Air resistance only matters for very light or fluffy objects.',explanation:'Air resistance acts on all objects moving through air. Even heavy objects are affected — a skydiver in freefall reaches a terminal velocity well below what they would reach without air.'},
          {id:'S2_M2',text:'The paper landed with the book because the book physically pushed it downward.',explanation:'The book did not push the paper. The paper was shielded from oncoming air. Without air resistance acting on it, the paper fell at the same rate as the book — because the confounding variable was eliminated.'},
          {id:'S2_M3',text:'Galileo\'s method and the ramp experiment we did are fundamentally different things.',explanation:'They are the same method. Fix one variable (angle), vary another (length), measure (time), repeat, find a pattern. Galileo did this with a water clock. You did it with a digital timer. Tools differ — method is identical.'},
          {id:'S2_M4',text:'Once you understand a concept, repeating the experiment adds no value.',explanation:'Repetition checks for consistency, reduces random error, tests whether results hold under different conditions, and builds the body of evidence needed to support a scientific claim.'},
          {id:'S2_M5a',text:'The crumpled paper fell faster because it is more compact and therefore heavier.',explanation:'The crumpled and flat paper have identical mass — the same sheet was simply reshaped. What changed was surface area, which reduced drag. It fell faster because of less air resistance, not greater weight.'},
          {id:'S2_M5b',text:'The crumpled paper fell faster because crumpling increases its density, and denser objects fall faster.',explanation:'Crumpling does increase density, but density alone does not determine fall speed in air. The crumpled paper fell faster because its smaller surface area reduced air resistance — not because its density increased.'},
        ],
        correct:[
          {id:'S2_C0',text:'Sheltering the paper from air resistance made it fall at the same rate as the book.',explanation:'Correct. With air resistance removed, the only force was gravity. Under gravity alone, all objects accelerate equally. The paper and book fell together because the confounding variable was eliminated.'},
          {id:'S2_C1',text:'Isolating one variable at a time is what makes an experiment\'s result trustworthy.',explanation:'Correct. If multiple variables change at once, you cannot tell which caused the result. Changing only one thing at a time produces clean, interpretable results.'},
          {id:'S2_C2',text:'The same scientific method Galileo used 400 years ago is still how physics works today.',explanation:'Correct. Controlled experimentation, repeated measurement, and pattern-finding are the foundation of modern science. The tools have changed — the method has not.'},
          {id:'S2_C3',text:'Two objects with the same mass can fall at very different speeds in air, depending on their shape.',explanation:'Correct. The flat and crumpled paper demonstrated this directly. Same mass, same gravitational force — but very different speeds because shape determines drag.'},
        ],
      },
      draw:{misconceptions:3,correct:2},
    },
  ],
  pinnedOptions:[
    {id:'ADD_THOUGHTS',text:'I have additional thoughts…',type:'freetext_optional',placeholder:'Share any additional observations or ideas…'},
    {id:'NONE',text:'None of the above.',type:'none',placeholder:'None of the statements match your thinking — describe what you believe is happening…'},
  ],
  ui:{watchDropBtn:'▶ Watch the drop',replayBtn:'↺ Replay',submitBtn:'Submit →',continueBtn:'Continue →',completeBtn:'Complete the Lab ✓',submitLockHint:'Select at least one option to continue.',noneMinChars:10,revealDelayMs:120,countdownFrom:3},
  completion:{icon:'🔬',title:'Lab Complete',message:'You observed, you measured, you found the pattern.\nFour hundred years later — the method still works.'},
  footnote:`Historical note: The Tower of Pisa story originates from Viviani's <em>Life of Galileo</em> (c.&thinsp;1654), written approximately 12 years after Galileo's death. Galileo's inclined plane experiments are documented in his own <em>Discourses and Mathematical Demonstrations Relating to Two New Sciences</em> (1638).`,
};
</script>

<script>
/**

 * Usage:

 * Alias read from DataLogger.getAlias() if available, else 'anonymous'.
 * Same alias → same MCQ draw every time. Different aliases → different draws.
 */

const DrawHistory = (() => {

  // ── SEEDED PRNG ────────────────────────────────────────────────────────────
  function _hashAlias(str) {
    let h = 5381;
    for (let i = 0; i < str.length; i++) {
      h = ((h << 5) + h) ^ str.charCodeAt(i);
      h = h >>> 0;
    }
    return h;
  }

  function _makePRNG(seed) {
    let s = seed >>> 0;
    return function () {
      s += 0x6D2B79F5;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function _shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function _pick(arr, n, rng) {
    return _shuffle(arr, rng).slice(0, Math.min(n, arr.length));
  }

  // ── ALIAS ──────────────────────────────────────────────────────────────────
  function _getAlias() {
    try {
      if (typeof DataLogger !== 'undefined' && DataLogger.getAlias) {
        return DataLogger.getAlias() || 'anonymous';
      }
    } catch (e) {}
    return 'anonymous';
  }

  // ── MINI CANVAS ────────────────────────────────────────────────────────────
  function _buildMiniCanvas(onFirstPlay) {
    const ui   = HistoryData.ui;
    const wrap = document.createElement('div');
    wrap.className = 'hist-canvas-wrap';

    const cv = document.createElement('canvas');
    cv.className = 'hist-canvas'; cv.height = 300;
    wrap.appendChild(cv);

    const btnRow = document.createElement('div'); btnRow.className = 'hist-canvas-btns';
    const watchBtn = document.createElement('button');
    watchBtn.className = 'hist-btn'; watchBtn.textContent = ui.watchDropBtn;
    btnRow.appendChild(watchBtn);
    const replayBtn = document.createElement('button');
    replayBtn.className = 'hist-btn secondary'; replayBtn.textContent = ui.replayBtn; replayBtn.style.display = 'none';
    btnRow.appendChild(replayBtn);
    const status = document.createElement('span'); status.className = 'hist-canvas-status';
    btnRow.appendChild(status);
    wrap.appendChild(btnRow);

    // Physics
    const G=9.81, RHO=1.225, DROP_M=2.0, SCALE_PX=90;
    // Layout: TOP = H*0.18 = 54px, BOT = 54 + 2.0*90 = 234px — fits in 300px with 66px for landed tags
    const flat     = {mass:0.005, dragArea:0.060, Cd:1.17};
    const crumpled = {mass:0.005, dragArea:0.004, Cd:0.47};
    let rafId=null, objA, objB, simT, wobA, phase, landedTs, cdTs, cd, hasPlayed=false;

    function _accel(obj,v){ return Math.max(0,G-(0.5*RHO*obj.Cd*obj.dragArea*v*v)/obj.mass); }
    function _rk4(s,v,dt,obj){
      const a1=_accel(obj,v),v2=v+.5*dt*a1,a2=_accel(obj,v2);
      const v3=v+.5*dt*a2,a3=_accel(obj,v3),v4=v+dt*a3,a4=_accel(obj,v4);
      return{s:s+dt*(v+2*v2+2*v3+v4)/6,v:v+dt*(a1+2*a2+2*a3+a4)/6};
    }

    function _startDrop(){
      cancelAnimationFrame(rafId);
      objA={s:0,v:0,landed:false,landT:null};
      objB={s:0,v:0,landed:false,landT:null};
      simT=0; wobA=0; landedTs=null; phase='countdown'; cdTs=null; cd=ui.countdownFrom;
      status.textContent=''; watchBtn.style.display='none'; replayBtn.style.display='none';
      let last=null;
      function loop(ts){
        if(!last) last=ts;
        const wdt=Math.min((ts-last)/1000,0.033); last=ts;
        if(phase==='countdown'){
          if(!cdTs) cdTs=ts;
          cd=Math.max(0,ui.countdownFrom-Math.floor((ts-cdTs)/900));
          if(ts-cdTs>=ui.countdownFrom*900){phase='dropping';last=null;}
          _draw(ts); rafId=requestAnimationFrame(loop); return;
        }
        if(phase==='dropping'){
          const steps=10,dt=wdt/steps;
          for(let i=0;i<steps;i++){
            if(!objA.landed){const n=_rk4(objA.s,objA.v,dt,flat);objA.s=n.s;objA.v=n.v;if(objA.s>=DROP_M){objA.s=DROP_M;objA.landed=true;objA.landT=simT;}}
            if(!objB.landed){const n=_rk4(objB.s,objB.v,dt,crumpled);objB.s=n.s;objB.v=n.v;if(objB.s>=DROP_M){objB.s=DROP_M;objB.landed=true;objB.landT=simT;}}
            simT+=dt;
          }
          if(!objA.landed) wobA=Math.sin(ts*0.005)*12*(1-objA.s/DROP_M*0.5); else wobA*=0.9;
          if(objA.landed&&objB.landed&&!landedTs){landedTs=ts;phase='landed';}
        }
        if(phase==='landed'&&ts-landedTs>700){
          phase='done';
          const diff=Math.abs(objA.landT-objB.landT).toFixed(3);
          status.textContent=`Crumpled landed ${diff}s earlier — same mass, different shape`;
          replayBtn.style.display='inline-block';
          if(!hasPlayed){hasPlayed=true; if(onFirstPlay) onFirstPlay();}
        }
        _draw(ts);
        if(phase!=='done') rafId=requestAnimationFrame(loop);
      }
      rafId=requestAnimationFrame(loop);
    }

    function _draw(ts){
      const W=cv.offsetWidth||480, H=300;
      if(cv.width!==W){cv.width=W;}
      const ctx=cv.getContext('2d');
      const TOP=H*0.18, BOT=TOP+DROP_M*SCALE_PX, LA=W*0.32, LB=W*0.68;
      ctx.clearRect(0,0,W,H);
      // grid
      ctx.strokeStyle='rgba(255,255,255,0.018)'; ctx.lineWidth=1;
      for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      // ruler
      ctx.strokeStyle='rgba(77,240,176,0.15)'; ctx.setLineDash([2,5]);
      ctx.beginPath();ctx.moveTo(24,TOP);ctx.lineTo(24,BOT);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='rgba(77,240,176,0.35)';ctx.font='9px DM Mono,monospace';ctx.textAlign='right';
      for(let m=0;m<=DROP_M;m++){
        const y=TOP+m*SCALE_PX; ctx.fillText(m+'m',22,y+3);
        ctx.strokeStyle='rgba(77,240,176,0.2)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(18,y);ctx.lineTo(25,y);ctx.stroke();
      }
      // platform
      ctx.fillStyle='#1e2640';
      ctx.beginPath();ctx.roundRect(W*0.14,TOP-14,W*0.72,14,3);ctx.fill();
      ctx.strokeStyle='#2e3a58';ctx.lineWidth=1;ctx.stroke();
      // lane labels — above platform
      ctx.font='10px DM Mono,monospace';ctx.textAlign='center';
      ctx.fillStyle='#ffd16699';ctx.fillText('Flat paper',LA,TOP-19);
      ctx.fillStyle='#ffd16699';ctx.fillText('Crumpled',LB,TOP-19);
      // ground
      ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(W*0.1,BOT);ctx.lineTo(W*0.9,BOT);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,0.04)';ctx.fillRect(W*0.1,BOT,W*0.8,4);
      // guides
      [LA,LB].forEach(x=>{ctx.strokeStyle='rgba(255,209,102,0.10)';ctx.lineWidth=1;ctx.setLineDash([3,7]);ctx.beginPath();ctx.moveTo(x,TOP);ctx.lineTo(x,BOT);ctx.stroke();ctx.setLineDash([]);});
      // countdown overlay
      if(phase==='countdown'){
        _drawPaper(ctx,LA,TOP-4,0); _drawCrumpled(ctx,LB,TOP-4);
        ctx.save();ctx.textAlign='center';
        if(cd>0){ctx.font='700 52px DM Sans,sans-serif';ctx.fillStyle='#4df0b0';ctx.shadowColor='#4df0b044';ctx.shadowBlur=20;ctx.fillText(cd,W/2,H/2+14);}
        else{ctx.font='700 38px DM Sans,sans-serif';ctx.fillStyle='#ffd166';ctx.shadowColor='#ffd16644';ctx.shadowBlur=16;ctx.fillText('DROP!',W/2,H/2+10);}
        ctx.shadowBlur=0;ctx.restore();return;
      }
      // objects
      const yA=TOP+objA.s*SCALE_PX, yB=TOP+objB.s*SCALE_PX;
      _drawPaper(ctx,LA+wobA,yA,wobA); _drawCrumpled(ctx,LB,yB);
      if(objA.landed) _landedTag(ctx,LA,BOT,'#ffd166',objA.landT);
      if(objB.landed) _landedTag(ctx,LB,BOT,'#ffd166',objB.landT);
    }

    function _drawPaper(ctx,x,y,wob){
      ctx.save();ctx.translate(x,y);ctx.rotate(wob*0.04);
      const g=ctx.createLinearGradient(-20,-3,20,3);
      g.addColorStop(0,'#ccc8bc');g.addColorStop(0.5,'#eeeae0');g.addColorStop(1,'#ccc8bc');
      ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-20,-4,40,8,1);ctx.fill();
      ctx.strokeStyle='#b8b4a8';ctx.lineWidth=0.8;ctx.stroke();ctx.restore();
    }
    function _drawCrumpled(ctx,x,y){
      ctx.save();ctx.translate(x,y);
      const pts=[0,-10,7,-7,10,0,7,8,2,11,-5,10,-10,4,-9,-4,-4,-10];
      ctx.beginPath();ctx.moveTo(pts[0],pts[1]);
      for(let i=2;i<pts.length;i+=2)ctx.lineTo(pts[i],pts[i+1]);
      ctx.closePath();
      const g=ctx.createRadialGradient(-2,-3,0,0,0,10);
      g.addColorStop(0,'#eae6d6');g.addColorStop(1,'#b0a898');
      ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#a09888';ctx.lineWidth=0.8;ctx.stroke();ctx.restore();
    }
    function _landedTag(ctx,x,bot,col,t){
      ctx.font='600 9px DM Mono,monospace';ctx.textAlign='center';ctx.fillStyle=col;ctx.fillText('LANDED',x,bot+14);
      if(t!==null){ctx.font='9px DM Mono,monospace';ctx.fillStyle=col+'88';ctx.fillText(t.toFixed(3)+'s',x,bot+24);}
    }

    // idle render
    requestAnimationFrame(()=>{
      cv.width=cv.offsetWidth||480;
      const ctx=cv.getContext('2d');
      ctx.fillStyle='rgba(77,240,176,0.25)';ctx.font='12px DM Sans,sans-serif';ctx.textAlign='center';
      ctx.fillText('Click ▶ Watch the drop to begin',cv.width/2, cv.height/2);
    });

    watchBtn.addEventListener('click',_startDrop);
    replayBtn.addEventListener('click',_startDrop);
    return wrap;
  }

  // ── FACTORY ────────────────────────────────────────────────────────────────
  function create(containerEl) {
    let _onComplete = null, _onSectionReveal = null;
    let _sectionEls = [], _complete = false, _alias = 'anonymous';
    const _responses = {};

    function _injectStyles(){
      if(document.getElementById('hist-styles')) return;
      const s=document.createElement('style');s.id='hist-styles';s.textContent=CSS;document.head.appendChild(s);
    }

    function _buildDOM(){
      containerEl.innerHTML='';
      const wrap=document.createElement('div');wrap.className='hist-wrap';
      // progress
      const prog=document.createElement('div');prog.className='hist-progress';
      HistoryData.sections.forEach((_,i)=>{const p=document.createElement('div');p.className='hist-pip';p.id=`hist-pip-${i}`;prog.appendChild(p);});
      const lbl=document.createElement('div');lbl.className='hist-prog-lbl';lbl.textContent='STAGE 5 OF 5';prog.appendChild(lbl);
      wrap.appendChild(prog);
      _sectionEls=[];
      HistoryData.sections.forEach((sec,i)=>{const c=_buildCard(sec,i);wrap.appendChild(c);_sectionEls.push(c);});
      // completion
      const {icon,title,message}=HistoryData.completion;
      const banner=document.createElement('div');banner.className='hist-complete';banner.id='hist-complete';
      banner.innerHTML=`<div class="hist-complete-icon">${icon}</div><div class="hist-complete-title">${title}</div><div class="hist-complete-sub">${message}</div>`;
      wrap.appendChild(banner);
      const src=document.createElement('div');src.className='hist-source';src.innerHTML=HistoryData.footnote;wrap.appendChild(src);
      containerEl.appendChild(wrap);
    }

    function _buildCard(sec,index){
      const seed  = (_hashAlias(_alias) + index * 0x9e3779b9) >>> 0;
      const rng1  = _makePRNG(seed);
      const drawnM = _pick(sec.pool.misconceptions, sec.draw.misconceptions, rng1);
      const drawnC = _pick(sec.pool.correct,        sec.draw.correct,        rng1);
      const rng2   = _makePRNG((seed ^ 0xdeadbeef) >>> 0);
      const drawn  = _shuffle([...drawnM,...drawnC], rng2);

      const card=document.createElement('div');card.className='hist-section';card.id=`hist-section-${index}`;
      card._drawnM=drawnM.map(x=>x.id);
      card._drawnC=drawnC.map(x=>x.id);
      card._drawn=drawn;

      // tag
      const tag=document.createElement('div');tag.className='hist-tag';tag.style.color=sec.tagColor;tag.textContent=`▸ ${sec.tag}`;card.appendChild(tag);
      // heading
      const h=document.createElement('div');h.className='hist-heading';h.textContent=sec.heading;card.appendChild(h);
      // figure
      if(FIGURES[sec.figure]){const fw=document.createElement('div');fw.className='hist-fig-wrap';fw.innerHTML=FIGURES[sec.figure];card.appendChild(fw);}
      // prose
      const prose=document.createElement('div');prose.className='hist-prose';prose.innerHTML=sec.prose;card.appendChild(prose);
      card.appendChild(Object.assign(document.createElement('div'),{className:'hist-clear'}));

      // MCQ gate wrapper (locked until canvas played for sec 0)
      const gate=document.createElement('div');
      gate.className='hist-mcq-gate'+(sec.hasCanvas?' locked':'');

      // canvas
      if(sec.hasCanvas){
        const canvasWrap=_buildMiniCanvas(()=>{
          gate.classList.remove('locked');gate.classList.add('open');
        });
        card.appendChild(canvasWrap);
      }

      // MCQ
      const mcqBox=document.createElement('div');mcqBox.className='hist-mcq';
      mcqBox.appendChild(Object.assign(document.createElement('div'),{className:'hist-mcq-label',textContent:'▸ Select all that apply'}));
      mcqBox.appendChild(Object.assign(document.createElement('div'),{className:'hist-mcq-prompt',textContent:sec.prompt}));

      const selectedIds=new Set();
      const onChange=()=>_updateSubmit(index,selectedIds);

      drawn.forEach(item=>{
        const isC=sec.pool.correct.some(c=>c.id===item.id);
        mcqBox.appendChild(_buildOptionRow(item,isC,selectedIds,onChange));
      });
      mcqBox.appendChild(Object.assign(document.createElement('hr'),{className:'hist-opt-divider'}));
      HistoryData.pinnedOptions.forEach(pin=>mcqBox.appendChild(_buildPinnedRow(pin,selectedIds,onChange)));

      // footer
      const footer=document.createElement('div');footer.className='hist-mcq-footer';
      const hint=document.createElement('span');hint.className='hist-lock-hint';hint.id=`hist-hint-${index}`;hint.textContent=HistoryData.ui.submitLockHint;
      const submitBtn=document.createElement('button');submitBtn.className='hist-btn';submitBtn.id=`hist-submit-${index}`;submitBtn.textContent=HistoryData.ui.submitBtn;submitBtn.disabled=true;
      submitBtn.addEventListener('click',()=>_submitSection(index,selectedIds,drawn,sec));
      footer.appendChild(hint);footer.appendChild(submitBtn);
      mcqBox.appendChild(footer);
      gate.appendChild(mcqBox);
      card.appendChild(gate);

      // continue button
      const isLast=index===HistoryData.sections.length-1;
      const cont=document.createElement('button');cont.className='hist-btn hist-cont-btn';cont.id=`hist-cont-${index}`;
      cont.textContent=isLast?HistoryData.ui.completeBtn:HistoryData.ui.continueBtn;
      cont.addEventListener('click',()=>_advance(index));
      card.appendChild(cont);
      return card;
    }

    function _buildOptionRow(item,isCorrect,selectedIds,onChange){
      const row=document.createElement('div');row.className='hist-opt';row.dataset.id=item.id;
      const box=document.createElement('div');box.className='hist-opt-check';
      box.appendChild(Object.assign(document.createElement('span'),{className:'hist-opt-check-tick',textContent:'✓'}));
      const body=document.createElement('div');body.className='hist-opt-body';
      body.appendChild(Object.assign(document.createElement('div'),{className:'hist-opt-text',textContent:item.text}));
      const rev=document.createElement('div');rev.className='hist-reveal';rev.id=`hist-rev-${item.id}`;body.appendChild(rev);
      row.appendChild(box);row.appendChild(body);
      row.addEventListener('click',()=>{
        if(row.classList.contains('locked'))return;
        selectedIds.has(item.id)?selectedIds.delete(item.id):selectedIds.add(item.id);
        row.classList.toggle('selected',selectedIds.has(item.id));
        onChange();
      });
      return row;
    }

    function _buildPinnedRow(pin,selectedIds,onChange){
      const row=document.createElement('div');row.className='hist-opt';row.dataset.id=pin.id;
      const box=document.createElement('div');box.className='hist-opt-check';
      box.appendChild(Object.assign(document.createElement('span'),{className:'hist-opt-check-tick',textContent:'✓'}));
      const body=document.createElement('div');body.className='hist-opt-body';
      body.appendChild(Object.assign(document.createElement('div'),{className:'hist-opt-text',textContent:pin.text}));
      // free-text
      const ftWrap=document.createElement('div');ftWrap.className='hist-freetext-wrap';ftWrap.id=`hist-ft-wrap-${pin.id}`;
      const ta=document.createElement('textarea');ta.className='hist-freetext';ta.id=`hist-ft-${pin.id}`;ta.placeholder=pin.placeholder;ta.rows=3;
      const ctr=document.createElement('div');ctr.className='hist-freetext-count';ctr.id=`hist-ftc-${pin.id}`;
      if(pin.type==='none'){
        ctr.textContent=`${HistoryData.ui.noneMinChars} characters needed`;
        ta.addEventListener('input',()=>{
          const left=Math.max(0,HistoryData.ui.noneMinChars-ta.value.trim().length);
          ctr.textContent=left?`${left} more character${left===1?'':'s'} needed`:'✓ Ready';
          ctr.classList.toggle('ready',!left);
          onChange();
        });
      }
      ftWrap.appendChild(ta);ftWrap.appendChild(ctr);body.appendChild(ftWrap);
      row.appendChild(box);row.appendChild(body);
      row.addEventListener('click',()=>{
        if(row.classList.contains('locked'))return;
        const nowSelected=!selectedIds.has(pin.id);
        nowSelected?selectedIds.add(pin.id):selectedIds.delete(pin.id);
        row.classList.toggle('selected',nowSelected);
        ftWrap.classList.toggle('open',nowSelected);
        if(nowSelected)ta.focus();
        onChange();
      });
      return row;
    }

    function _updateSubmit(index,selectedIds){
      const btn=document.getElementById(`hist-submit-${index}`);
      const hint=document.getElementById(`hist-hint-${index}`);
      if(!btn)return;
      if(selectedIds.size===0){btn.disabled=true;hint.textContent=HistoryData.ui.submitLockHint;return;}
      if(selectedIds.has('NONE')){
        const ta=document.getElementById('hist-ft-NONE');
        if(ta&&ta.value.trim().length<HistoryData.ui.noneMinChars){btn.disabled=true;hint.textContent='Please describe your thinking in the text box.';return;}
      }
      btn.disabled=false;hint.textContent='';
    }

    function _submitSection(index,selectedIds,drawn,sec){
      const card=_sectionEls[index];
      card.querySelectorAll('.hist-opt').forEach(r=>r.classList.add('locked'));
      const submitBtn=document.getElementById(`hist-submit-${index}`);
      if(submitBtn)submitBtn.style.display='none';
      const hint=document.getElementById(`hist-hint-${index}`);
      if(hint)hint.textContent='';

      const correctIds=card._drawnC;
      const sel=[...selectedIds];
      const selCorrect=sel.filter(id=>correctIds.includes(id));
      const selWrong  =sel.filter(id=>card._drawnM.includes(id));
      const missed    =correctIds.filter(id=>!selectedIds.has(id));
      const addText   =document.getElementById('hist-ft-ADD_THOUGHTS')?.value.trim()||'';
      const noneText  =document.getElementById('hist-ft-NONE')?.value.trim()||'';

      _responses[index]={
        shown:drawn.map(d=>d.id), selected_correct:selCorrect,
        selected_wrong:selWrong, missed_correct:missed,
        none_selected:selectedIds.has('NONE'), none_text:noneText, add_text:addText,
      };
      try{ if(typeof DataLogger!=='undefined'&&DataLogger.log) DataLogger.log(`history_s${index}`,_responses[index]); }catch(e){}

      // cascade reveal for selected items
      let delay=0;
      drawn.forEach(item=>{
        if(!selectedIds.has(item.id)){delay+=HistoryData.ui.revealDelayMs;return;}
        const isC=sec.pool.correct.some(c=>c.id===item.id);
        setTimeout(()=>_revealItem(item,isC),delay);
        delay+=HistoryData.ui.revealDelayMs;
      });

      // missed correct nudge + show continue
      setTimeout(()=>{
        missed.forEach(id=>{
          const rev=document.getElementById(`hist-rev-${id}`);
          if(!rev||rev.classList.contains('show'))return;
          const item=[...sec.pool.correct,...sec.pool.misconceptions].find(x=>x.id===id);
          if(!item)return;
          rev.className='hist-reveal missed show';
          rev.innerHTML=`<div class="hist-reveal-badge">▸ WORTH RECONSIDERING</div><div class="hist-reveal-text">${item.explanation}</div>`;
        });
        const cont=document.getElementById(`hist-cont-${index}`);
        if(cont)cont.style.display='inline-block';
      }, delay+200);
    }

    function _revealItem(item,isCorrect){
      const rev=document.getElementById(`hist-rev-${item.id}`);
      if(!rev)return;
      rev.className=`hist-reveal ${isCorrect?'correct':'wrong'} show`;
      rev.innerHTML=`<div class="hist-reveal-badge">▸ ${isCorrect?'CORRECT':'NOT QUITE'}</div><div class="hist-reveal-text">${item.explanation}</div>`;
    }

    function _updatePips(upTo){
      HistoryData.sections.forEach((_,i)=>{
        const p=document.getElementById(`hist-pip-${i}`);if(!p)return;
        p.className='hist-pip'+(i<upTo?' done':i===upTo?' cur':'');
      });
    }

    function _revealSection(index){
      const card=_sectionEls[index];if(!card)return;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        card.classList.add('visible');
        setTimeout(()=>card.scrollIntoView({behavior:'smooth',block:'start'}),120);
      }));
      _updatePips(index);
      if(typeof _onSectionReveal==='function')_onSectionReveal(index);
    }

    function _advance(fromIndex){
      const cont=document.getElementById(`hist-cont-${fromIndex}`);
      if(cont)cont.style.display='none';
      const next=fromIndex+1;
      if(next<HistoryData.sections.length){ _revealSection(next); }
      else{
        _complete=true; _updatePips(HistoryData.sections.length);
        const banner=document.getElementById('hist-complete');
        if(banner){banner.classList.add('visible');setTimeout(()=>banner.scrollIntoView({behavior:'smooth',block:'nearest'}),150);}
        if(_onComplete)_onComplete({..._responses});
      }
    }

    function onComplete(fn){_onComplete=fn;}
    function start(){_alias=_getAlias();_injectStyles();_buildDOM();_revealSection(0);}
    function reset(){_complete=false;Object.keys(_responses).forEach(k=>delete _responses[k]);containerEl.innerHTML='';_sectionEls=[];}
    function getResponses(){return{..._responses};}

    return{onComplete,start,reset,isComplete:()=>_complete,getResponses,_setRevealHook:fn=>{_onSectionReveal=fn;},SECTION_COUNT:HistoryData.sections.length};
  }

  return{create,_hashAlias,_makePRNG,SECTION_COUNT:HistoryData?.sections?.length||3};
})();

if(typeof module!=='undefined')module.exports=DrawHistory;

</script>


<script>
let hist = null;

document.getElementById('aliasInput').addEventListener('input', updateSeedPreview);
updateSeedPreview();

function updateSeedPreview(){
  const alias = document.getElementById('aliasInput').value.trim()||'anonymous';
  DataLogger._alias = alias;
  if(typeof DrawHistory!=='undefined'){
    const seed = DrawHistory._hashAlias(alias);
    document.getElementById('seedChip').textContent = `alias: "${alias}" → seed: ${seed}`;
  }
}

function doStart(){
  const alias = document.getElementById('aliasInput').value.trim()||'anonymous';
  DataLogger._alias = alias;
  resetUI();
  if(hist) hist.reset();
  hist = DrawHistory.create(document.getElementById('histContainer'));
  hist._setRevealHook(index=>{
    updateChips(index);
    log(`<span class="info">Section ${index+1} revealed (alias: ${alias})</span>`);
  });
  hist.onComplete(responses=>{
    document.getElementById('chip-done').classList.add('done');
    Object.entries(responses).forEach(([i,r])=>{
      const el=document.getElementById(`resp-${i}`);
      if(el) el.textContent=JSON.stringify(r,null,2);
    });
    log('<span class="ok">✓ Lab complete — all responses captured</span>');
    Object.entries(responses).forEach(([i,r])=>{
      const sc=r.selected_correct?.length||0, sw=r.selected_wrong?.length||0, mc=r.missed_correct?.length||0;
      log(`  S${Number(i)+1}: ✓${sc} correct  ✗${sw} wrong  ⚠${mc} missed`);
      if(r.none_selected) log(`  S${Number(i)+1}: "None" selected → "${r.none_text}"`);
      if(r.add_text) log(`  S${Number(i)+1}: add_text → "${r.add_text}"`);
    });
  });
  hist.start();
  log(`Started — alias: "${alias}"`);
  updateChips(0);
}

function doReset(){
  if(hist){hist.reset();}
  hist=null;
  resetUI();
  log('Reset');
}

function updateChips(current){
  [0,1,2].forEach(i=>{
    const c=document.getElementById(`chip-${i}`);
    c.classList.remove('active','done');
    if(i<current) c.classList.add('done');
    else if(i===current) c.classList.add('active');
  });
}

function resetUI(){
  [0,1,2].forEach(i=>{
    const c=document.getElementById(`chip-${i}`);c.classList.remove('active','done');
    const r=document.getElementById(`resp-${i}`);if(r)r.textContent='—';
  });
  document.getElementById('chip-done').classList.remove('done','active');
  document.getElementById('histContainer').innerHTML='';
}

function log(msg){
  const el=document.getElementById('log');
  el.innerHTML+=`<div>${msg}</div>`;el.scrollTop=el.scrollHeight;
}

log('Ready. Enter an alias and click ▶ Start.');
log('Try different aliases to see different MCQ draws.');
</script>
